<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="icon" type="image/jpeg" href="../assets/icons/Afdal Adha Firnansyah.png">
    <title>The Last One — Fiction World</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --gold: #d4af37;
            --pink: #e879a8;
            --dark: #0a0a0a;
            --dark-gray: #1a1a1a;
            --light-gray: #888;
            --white: #ffffff;
            --sidebar-width: 260px;
        }

        html {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            min-height: 100dvh;
            overflow-x: hidden;
            color: var(--white);
        }

        .bg-image {
            position: fixed;
            inset: 0;
            background-image: url('../assets/background/background 3.jpg');
            background-size: cover;
            background-position: center;
            z-index: 0;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(5,5,5,0.95) 0%, rgba(15,10,5,0.90) 50%, rgba(5,5,5,0.95) 100%),
                radial-gradient(ellipse at 30% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(232, 121, 168, 0.04) 0%, transparent 50%);
            z-index: 1;
        }

        .app-container {
            position: relative;
            z-index: 10;
            display: flex;
            min-height: 100dvh;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: rgba(15, 15, 15, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(212, 175, 55, 0.1);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100dvh;
            
            z-index: 2000;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 32px 24px 24px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            flex-shrink: 0;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--pink));
            padding: 2px;
            flex-shrink: 0;
            animation: heartbeat 2s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.08); }
            28% { transform: scale(1); }
            42% { transform: scale(1.08); }
            70% { transform: scale(1); }
        }

        .sidebar-logo img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: var(--dark-gray);
        }

        .sidebar-title {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .sidebar-subtitle {
            font-size: 10px;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .sidebar-nav {
            flex: 1;
            padding: 20px 16px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .nav-section {
            margin-bottom: 24px;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.3);
            padding: 0 12px;
            margin-bottom: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-bottom: 6px;
            position: relative;
            min-height: 48px;
        }

        .nav-item:hover, .nav-item:active {
            background: rgba(212, 175, 55, 0.12);
            color: var(--white);
        }

        .nav-item.active {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold);
            border: 1px solid rgba(212, 175, 55, 0.25);
        }

        .nav-icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            flex-shrink: 0;
        }

        /* User Card */
        .user-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            min-height: 48px;
        }

        .user-card:hover {
            background: rgba(212, 175, 55, 0.08);
            border-color: rgba(212, 175, 55, 0.25);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .user-card:hover .user-avatar {
            transform: scale(1.08);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .avatar-fallback {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--pink));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: var(--dark);
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.3s ease;
        }

        .user-card:hover .user-name {
            color: var(--gold);
        }

        .user-role {
            font-size: 11px;
            color: var(--gold);
            opacity: 0.7;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 32px;
            min-height: 100dvh;
            transition: margin-left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Top Bar */
        .top-bar {
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .page-subtitle {
            font-size: 13px;
            color: var(--light-gray);
        }

        /* Mobile Menu Toggle - FIX: z-index di bawah sidebar */
        .menu-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            
            z-index: 1500;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--gold);
            font-size: 22px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .menu-toggle:hover, .menu-toggle:active {
            background: rgba(212, 175, 55, 0.15);
            transform: scale(1.05);
        }

        .menu-toggle.active {
            background: rgba(212, 175, 55, 0.2);
            border-color: var(--gold);
        }

        

        @media (max-width: 900px) {
            .sidebar {
                transform: translateX(-100%);
                box-shadow: none;
                width: 280px;
            }

            .sidebar.open {
                transform: translateX(0);
                box-shadow: 4px 0 30px rgba(0, 0, 0, 0.5);
            }

            .main-content {
                margin-left: 0;
                padding: 80px 20px 20px;
            }

            .menu-toggle {
                display: flex;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }

            .stat-card {
                height: 300px;
            }

            .page-title {
                font-size: 24px;
            }

            .hero-quote {
                padding: 24px;
            }

            .quote-text {
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .stat-card {
                height: 280px;
                border-radius: 20px;
            }

            .stat-content {
                padding: 16px;
            }

            .stat-title {
                font-size: 15px;
            }

            .stat-subtitle {
                font-size: 11px;
            }

            .main-content {
                padding: 80px 16px 16px;
            }

            .sidebar {
                width: 260px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        .animate-in {
            animation: fadeInUp 0.6s ease forwards;
        }

        .delay-1 { animation-delay: 0.1s; opacity: 0; }
        .delay-2 { animation-delay: 0.2s; opacity: 0; }
        .delay-3 { animation-delay: 0.3s; opacity: 0; }
        .delay-4 { animation-delay: 0.4s; opacity: 0; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <div class="app-container">
        <!-- Sidebar: z-index 2000, PALING ATAS -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <div class="sidebar-logo">
                        <img src="../assets/icons/Afdal Adha Firnansyah.png" alt="Logo" onerror="this.style.display='none'; this.parentElement.style.background='linear-gradient(135deg, var(--gold), var(--pink))'; this.parentElement.innerHTML='<span style=\'width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:16px;\'>💝</span>';">
                    </div>
                    <div>
                        <div class="sidebar-title">The Last One</div>
                        <div class="sidebar-subtitle">Fiction World</div>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav" id="sidebarNav">
                <div class="nav-section">
                    <div class="nav-label">Menu Utama</div>
                    <a href="../templates/dashboard.html" class="nav-item">
                        <span class="nav-icon">◈</span>
                        <span>Dashboard</span>
                    </a>
                    <a href="../templates/tentang halicarnas.html" class="nav-item active">
                        <span class="nav-icon">✦</span>
                        <span>Tentang Halicarnas</span>
                    </a>
                    <a href="../templates/galeri halicarnas.html" class="nav-item">
                        <span class="nav-icon">✧</span>
                        <span>Galeri Halicarnas</span>
                    </a>
                    <a href="../templates/pemberitahuan.html" class="nav-item">
                        <span class="nav-icon">✶</span>
                        <span>Pemberitahuan</span>
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <a href="../templates/profile.html" class="user-card">
                    <div class="user-avatar">
                        <img src="../assets/icons/Afdal Adha Firnansyah.png" alt="Avatar" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'avatar-fallback\'>AF</div>';">
                    </div>
                    <div class="user-info">
                        <div class="user-name">Afdal Adha F.</div>
                        <div class="user-role">Sang Penulis</div>
                    </div>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <div class="top-bar animate-in">
                <h1 class="page-title">The Last One</h1>
                <p class="page-subtitle">Selamat datang di dunia fiksi ku, silahkan menjelajahi dunia ini.</p>
            </div>
        </main>
    </div>
</body>
</html>
